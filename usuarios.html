<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TS Sports · Usuarios</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="crm.css" />
</head>
<body class="admin-body">

  <!-- ===== Login ===== (oculto hasta saber si hay sesión, para evitar el parpadeo) -->
  <section class="login-screen" id="loginScreen" style="display:none">
    <form class="login-card" id="loginForm">
      <div class="brand brand-login"><span class="brand-mark">TS</span><span class="brand-name">Sports</span></div>
      <h1>Usuarios</h1>
      <p class="login-sub">Inicia sesión como administrador.</p>
      <div class="field"><label for="loginEmail">Email</label><input type="email" id="loginEmail" required autocomplete="username" /></div>
      <div class="field"><label for="loginPass">Contraseña</label><input type="password" id="loginPass" required autocomplete="current-password" /></div>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      <p class="login-status" id="loginStatus" role="status"></p>
      <p class="login-mode" id="loginMode"></p>
    </form>
  </section>

  <!-- ===== App ===== -->
  <div class="admin-app" id="usersApp" hidden>
    <header class="admin-top">
      <div class="admin-bar admin-bar-main">
        <div class="brand"><span class="brand-mark">TS</span><span class="brand-name">Sports</span><span class="admin-badge">CRM</span></div>
        <nav class="admin-bar-nav">
          <span class="admin-mode-tag" id="userTag"></span>
          <a href="crm.html" class="btn btn-ghost btn-sm"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Volver al CRM</a>
          <button class="btn btn-text" id="logoutBtn">Salir</button>
        </nav>
      </div>
      <div class="admin-bar admin-bar-actions">
        <span class="admin-bar-title">Usuarios y comerciales</span>
        <button class="btn btn-text" id="refreshBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>Actualizar</button>
      </div>
    </header>

    <main class="users-main">
      <div id="notAdmin" class="card" hidden style="max-width:560px;margin:24px auto">
        <h3>Acceso solo para administradores</h3>
        <p class="panel-desc" style="margin:8px 0 0">Tu cuenta es de tipo comercial. Pídele a un administrador que gestione los usuarios.</p>
      </div>

      <div id="adminContent" hidden>
        <!-- Crear -->
        <div class="card users-create">
          <h3 style="margin-bottom:14px">Crear nuevo usuario</h3>
          <form id="newUserForm">
            <div class="users-create-grid">
              <div class="field"><label>Nombre</label><input type="text" id="nu-name" required /></div>
              <div class="field"><label>Email</label><input type="email" id="nu-email" required /></div>
              <div class="field"><label>Contraseña</label><input type="text" id="nu-pass" required minlength="6" placeholder="mín. 6 caracteres" /></div>
              <div class="field"><label>Rol</label><select id="nu-role"><option value="comercial">Comercial</option><option value="admin">Admin</option></select></div>
              <div class="field" style="align-self:end"><button type="submit" class="btn btn-primary btn-block">Crear usuario</button></div>
            </div>
            <p class="form-status" id="newUserStatus" style="text-align:left"></p>
          </form>
        </div>

        <!-- Tabla -->
        <div class="card" style="padding:0;overflow:hidden">
          <table class="users-table">
            <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Registrado</th></tr></thead>
            <tbody id="usersTbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="save-toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="usuarios.js"></script>
</body>
</html>
