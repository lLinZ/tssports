<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TS Sports · Panel de administración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

  <!-- ===== Login ===== -->
  <section class="login-screen" id="loginScreen">
    <form class="login-card" id="loginForm">
      <div class="brand brand-login">
        <span class="brand-mark">TS</span><span class="brand-name">Sports</span>
      </div>
      <h1>Panel de administración</h1>
      <p class="login-sub">Inicia sesión para editar el contenido del sitio.</p>
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="loginPass">Contraseña</label>
        <input type="password" id="loginPass" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      <p class="login-status" id="loginStatus" role="status"></p>
      <p class="login-mode" id="loginMode"></p>
    </form>
  </section>

  <!-- ===== Panel ===== -->
  <div class="admin-app" id="adminApp" hidden>
    <header class="admin-top">
      <div class="admin-bar admin-bar-main">
        <div class="brand"><span class="brand-mark">TS</span><span class="brand-name">Sports</span><span class="admin-badge">CRM</span></div>
        <nav class="admin-bar-nav">
          <span class="admin-mode-tag" id="modeTag"></span>
          <a href="crm.html" class="btn btn-ghost btn-sm"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>CRM</a>
          <a href="index.html" target="_blank" class="btn btn-ghost btn-sm">Ver sitio<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>
          <button class="btn btn-text" id="logoutBtn">Salir</button>
        </nav>
      </div>
      <div class="admin-bar admin-bar-actions">
        <span class="admin-bar-title">Editor de contenido</span>
        <button class="btn btn-text" id="resetBtn" title="Volver al contenido de fábrica"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>Restablecer</button>
        <button class="btn btn-primary btn-sm" id="saveBtn">Guardar cambios</button>
      </div>
    </header>

    <div class="admin-layout">
      <nav class="admin-tabs" id="adminTabs">
        <button class="tab active" data-tab="colors"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.555C21.965 6.012 17.461 2 12 2z"/></svg>Colores</button>
        <button class="tab" data-tab="images"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Imágenes</button>
        <button class="tab" data-tab="texts"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>Textos</button>
        <button class="tab" data-tab="team"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Equipo</button>
        <button class="tab" data-tab="services"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Servicios</button>
        <button class="tab" data-tab="projects"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Proyectos</button>
        <button class="tab" data-tab="allies"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>Aliados</button>
        <button class="tab" data-tab="contact"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>Contacto</button>
      </nav>

      <main class="admin-main">
        <section class="panel active" id="panel-colors"></section>
        <section class="panel" id="panel-images"></section>
        <section class="panel" id="panel-texts"></section>
        <section class="panel" id="panel-team"></section>
        <section class="panel" id="panel-services"></section>
        <section class="panel" id="panel-projects"></section>
        <section class="panel" id="panel-allies"></section>
        <section class="panel" id="panel-contact"></section>
      </main>
    </div>

    <div class="save-toast" id="saveToast"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="content-defaults.js"></script>
  <script src="store.js"></script>
  <script src="admin.js"></script>
</body>
</html>
