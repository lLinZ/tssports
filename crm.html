<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TS Sports · CRM de Patrocinios</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="crm.css" />
</head>
<body class="admin-body">

  <!-- ===== Login ===== -->
  <section class="login-screen" id="loginScreen">
    <form class="login-card" id="loginForm">
      <div class="brand brand-login"><span class="brand-mark">TS</span><span class="brand-name">Sports</span></div>
      <h1>CRM de Patrocinios</h1>
      <p class="login-sub">Inicia sesión para gestionar tus clientes y oportunidades.</p>
      <div class="field"><label for="loginEmail">Email</label><input type="email" id="loginEmail" required autocomplete="username" /></div>
      <div class="field"><label for="loginPass">Contraseña</label><input type="password" id="loginPass" required autocomplete="current-password" /></div>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      <p class="login-status" id="loginStatus" role="status"></p>
      <p class="login-mode" id="loginMode"></p>
    </form>
  </section>

  <!-- ===== App ===== -->
  <div class="admin-app" id="crmApp" hidden>
    <header class="admin-top">
      <div class="admin-bar admin-bar-main">
        <div class="brand"><span class="brand-mark">TS</span><span class="brand-name">Sports</span><span class="admin-badge">CRM</span></div>
        <nav class="admin-bar-nav">
          <a href="admin.html" class="btn btn-ghost btn-sm"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>Contenido</a>
          <a href="index.html" target="_blank" class="btn btn-ghost btn-sm">Ver sitio<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>
          <button class="btn btn-text" id="logoutBtn">Salir</button>
        </nav>
      </div>
      <div class="admin-bar admin-bar-actions">
        <span class="admin-bar-title">CRM de Patrocinios</span>
        <button class="btn btn-text" id="refreshBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>Actualizar</button>
        <button class="btn btn-primary btn-sm" id="addBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nueva oportunidad</button>
      </div>
    </header>

    <!-- Métricas -->
    <div class="crm-stats" id="crmStats"></div>

    <!-- Tablero Kanban -->
    <div class="crm-board" id="crmBoard"></div>
  </div>

  <!-- ===== Modal ===== -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <form class="modal-card" id="dealForm">
      <h2 id="modalTitle">Nueva oportunidad</h2>
      <input type="hidden" id="dealId" />
      <div class="grid-2">
        <div class="field"><label>Marca / Cliente *</label><input type="text" id="f-brand" required /></div>
        <div class="field"><label>Valor estimado (USD)</label><input type="number" id="f-value" min="0" step="100" /></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Persona de contacto</label><input type="text" id="f-contact" /></div>
        <div class="field"><label>Etapa</label>
          <select id="f-stage">
            <option value="nuevo">Nuevo</option>
            <option value="contactado">Contactado</option>
            <option value="propuesta">Propuesta</option>
            <option value="negociacion">Negociación</option>
            <option value="ganado">Ganado</option>
            <option value="perdido">Perdido</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Email</label><input type="email" id="f-email" /></div>
        <div class="field"><label>Teléfono</label><input type="text" id="f-phone" /></div>
      </div>
      <div class="field"><label>Notas</label><textarea id="f-notes" rows="3"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-text" id="deleteBtn">Eliminar</button>
        <div style="flex:1"></div>
        <button type="button" class="btn btn-text" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn btn-primary btn-sm">Guardar</button>
      </div>
    </form>
  </div>

  <div class="save-toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="crm.js"></script>
</body>
</html>
